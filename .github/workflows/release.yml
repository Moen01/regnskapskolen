name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
      - uses: actions/cache@v4
        with:
          path: .build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-
      - run: swift test
      - name: Build the app bundle
        run: APP_VERSION="${GITHUB_REF_NAME#v}" ./scripts/bundle.sh release
      - name: Zip it
        run: ditto -c -k --keepParent build/Regnskapsskolen.app "Regnskapsskolen-${GITHUB_REF_NAME#v}.zip"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP="Regnskapsskolen-${GITHUB_REF_NAME#v}.zip"
          gh release create "$GITHUB_REF_NAME" "$ZIP" --title "Regnskapsskolen ${GITHUB_REF_NAME#v}" --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" "$ZIP" --clobber
